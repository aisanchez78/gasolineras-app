<section class="buscador-card">

  <div class="buscador-hero">
    <span class="buscador-icon">⛽</span>
    <div>
      <h2 class="buscador-titulo">¿Dónde buscamos?</h2>
      <p class="buscador-subtitulo">Introduce tu ubicación para encontrar las gasolineras más baratas cerca de ti</p>
    </div>
  </div>

  <!-- Búsqueda rápida por código postal -->
  <div class="seccion">
    <p class="seccion-label">Código postal <span class="seccion-badge">Más rápido</span></p>
    <div class="cp-row">
      <input
        class="cp-input"
        type="text"
        [(ngModel)]="postalCode"
        placeholder="ej. 30001"
        maxlength="5"
        (keyup.enter)="searchByPostalCode()"
        [disabled]="loading" />
      <button class="btn-cp" (click)="searchByPostalCode()" [disabled]="loading || postalCode.length < 5">
        {{ loading ? '...' : 'Buscar' }}
      </button>
    </div>
  </div>

  <div class="separador"><span>o busca por dirección</span></div>

  <!-- Búsqueda por dirección -->
  <div class="seccion">
    <p class="seccion-label">Ciudad o dirección</p>
    <div class="search-wrap">
      <input
        class="search-input"
        type="text"
        [(ngModel)]="searchText"
        placeholder="ej. Murcia · Gran Vía Madrid · Sevilla"
        (keyup.enter)="searchByAddress()"
        [disabled]="loading" />
      <button class="search-btn" (click)="searchByAddress()" [disabled]="loading">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="separador"><span>o usa el GPS</span></div>

  <!-- GPS -->
  <button class="btn-gps" (click)="useGps()" [disabled]="loading">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="3"/>
      <line x1="12" y1="2" x2="12" y2="6"/>
      <line x1="12" y1="18" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="6" y2="12"/>
      <line x1="18" y1="12" x2="22" y2="12"/>
    </svg>
    {{ loading ? 'Detectando ubicación...' : 'Usar mi ubicación actual' }}
  </button>

  @if (error) {
    <p class="error-msg">⚠ {{ error }}</p>
  }

  @if (locationName) {
    <div class="lugar-encontrado">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
      </svg>
      <span>{{ locationName }}</span>
    </div>
  }

</section>
