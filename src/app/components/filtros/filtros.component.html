<section class="filtros-card">
  <h3 class="filtros-titulo">Filtros</h3>

  <div class="filtro-grupo">
    <label class="filtro-label">Tipo de carburante</label>
    <div class="chips-row">
      @for (tipo of fuelTypes; track tipo.value) {
        <button
          class="chip"
          [class.chip--active]="fuelType === tipo.value"
          (click)="fuelType = tipo.value; emit()">
          {{ tipo.label }}
        </button>
      }
    </div>
  </div>

  <div class="filtro-grupo">
    <label class="filtro-label">Radio de búsqueda: <strong>{{ radiusKm }} km</strong></label>
    <input
  type="range" min="1" max="50"
  [(ngModel)]="radiusKm"
  (ngModelChange)="emit()"
  class="slider"
  [style]="'--pct:' + (radiusKm * 2) + '%'" />    <div class="slider-ticks">
      <span>1 km</span><span>25 km</span><span>50 km</span>
    </div>
  </div>

  <div class="filtro-grupo">
    <label class="filtro-label">Filtrar por marca (lista blanca)</label>
    <div class="marcas-grid">
      @for (brand of availableBrands; track brand) {
        <button
          class="marca-chip"
          [class.marca-chip--active]="isBrandSelected(brand)"
          (click)="toggleBrand(brand)">
          {{ brand }}
        </button>
      }
    </div>
    @if (selectedBrands.length > 0) {
      <p class="marcas-nota">Mostrando solo: {{ selectedBrands.join(', ') }}</p>
    }
  </div>
</section>
