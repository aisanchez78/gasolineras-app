<section class="filtros-card">
  <h3 class="filtros-titulo">Filtros</h3>

  <div class="filtro-grupo">
    <label class="filtro-label">Tipo de carburante</label>
    <div class="chips-row">
      @for (tipo of tiposCarburante; track tipo.valor) {
        <button
          class="chip"
          [class.chip--active]="carburante === tipo.valor"
          (click)="carburante = tipo.valor; emitir()">
          {{ tipo.etiqueta }}
        </button>
      }
    </div>
  </div>

  <div class="filtro-grupo">
    <label class="filtro-label">Radio de búsqueda: <strong>{{ radioKm }} km</strong></label>
    <input
  type="range" min="1" max="50"
  [(ngModel)]="radioKm"
  (ngModelChange)="emitir()"
  class="slider"
  [style]="'--pct:' + (radioKm * 2) + '%'" />    <div class="slider-ticks">
      <span>1 km</span><span>25 km</span><span>50 km</span>
    </div>
  </div>

  <div class="filtro-grupo">
    <label class="filtro-label">Filtrar por marca (lista blanca)</label>
    <div class="marcas-grid">
      @for (marca of marcasDisponibles; track marca) {
        <button
          class="marca-chip"
          [class.marca-chip--active]="estaSeleccionada(marca)"
          (click)="toggleMarca(marca)">
          {{ marca }}
        </button>
      }
    </div>
    @if (marcasBlanqueadas.length > 0) {
      <p class="marcas-nota">Mostrando solo: {{ marcasBlanqueadas.join(', ') }}</p>
    }
  </div>
</section>
