<div class="app-shell" [class.has-comparador]="seleccionadas.length > 0" [attr.data-theme]="theme">
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">⛽</div>
      <div>
        <h1 class="app-title">GasolinApp</h1>
        <p class="app-tagline">Encuentra el carburante más barato cerca de ti</p>
      </div>
      <button class="theme-toggle" (click)="toggleTheme()" [title]="theme === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
        @if (theme === 'dark') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>
    </div>
  </header>

  <main class="app-main">
    <aside class="sidebar">
      <app-buscador (posicionDetectada)="onPosicion($event)" />
      <app-filtros (filtrosChanged)="onFiltros($event)" />
    </aside>

    <div class="contenido" [class.mobile-map]="mobileTab === 'map'">
      @if (busquedaRealizada && gasolinerasFiltradas.length > 0) {
        <app-mapa
          [gasolineras]="gasolinerasFiltradas"
          [posicion]="posicion"
          [filtros]="filtros"
          [gasolineraSeleccionada]="gasolineraParaRuta"
          [seleccionadas]="seleccionadas"
          [theme]="theme"
          class="mapa-wrap">
        </app-mapa>
      }

      <app-resultados
        [gasolineras]="gasolinerasFiltradas"
        [filtros]="filtros"
        [orden]="orden"
        [cargando]="cargando"
        [busquedaRealizada]="busquedaRealizada"
        [seleccionadas]="seleccionadas"
        (ordenChanged)="onOrden($event)"
        (toggleComparacion)="onToggleComparacion($event)"
        (seleccionarRuta)="onSeleccionarRuta($event)">
      </app-resultados>
    </div>
  </main>

  <app-comparador
    [seleccionadas]="seleccionadas"
    [filtros]="filtros"
    (remover)="onRemoverDeComparacion($event)"
    (limpiar)="onLimpiarComparacion()">
  </app-comparador>

  <nav class="mobile-tabs">
    <button class="mobile-tab" [class.mobile-tab--active]="mobileTab === 'list'" (click)="mobileTab = 'list'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      Lista
    </button>
    <button class="mobile-tab" [class.mobile-tab--active]="mobileTab === 'map'" (click)="mobileTab = 'map'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
        <line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>
      </svg>
      Mapa
    </button>
  </nav>
</div>
