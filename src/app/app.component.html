<div class="app-shell" [class.has-comparador]="comparisonSelection().length > 0" [attr.data-theme]="theme()">
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">⛽</div>
      <div>
        <h1 class="app-title">GasolinApp</h1>
        <p class="app-tagline">Encuentra el carburante más barato cerca de ti</p>
      </div>
      <!-- Theme menu -->
      <div class="theme-menu-wrap" (click)="$event.stopPropagation()">

        <button class="theme-toggle"
          [class.theme-toggle--open]="themeMenuOpen"
          (click)="toggleThemeMenu()"
          [attr.aria-expanded]="themeMenuOpen"
          aria-haspopup="true"
          title="Apariencia"
          aria-label="Preferencias de apariencia">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>

        @if (themeMenuOpen) {
          <div class="theme-menu" role="menu" aria-label="Preferencia de apariencia">
            <p class="theme-menu__title">Apariencia</p>
            <div class="theme-menu__divider"></div>

            @for (opt of themeOptions; track opt.value) {
              <button class="theme-menu__item"
                [class.theme-menu__item--active]="themePreference() === opt.value"
                (click)="setTheme(opt.value)"
                role="menuitem">

                <span class="item-icon">
                  @if (opt.value === 'dark') {
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                  } @else if (opt.value === 'light') {
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                      <circle cx="12" cy="12" r="5"/>
                      <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                  } @else {
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                  }
                </span>

                <span class="item-label">{{ opt.label }}</span>

                @if (themePreference() === opt.value) {
                  <svg class="item-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                }
              </button>
            }
          </div>
        }

      </div>
    </div>
  </header>

  <main class="app-main" [attr.data-tab]="mobileTab()">
    <aside class="sidebar" [class.mobile-visible]="mobileTab() === 'search'">
      <app-buscador (locationDetected)="onLocationDetected($event)" />
      <app-filtros
        [availableFuelTypes]="availableFuelTypes()"
        [availableBrands]="availableBrands()"
        [hasData]="hasSearched()"
        (filtersChanged)="onFiltersChanged($event)" />
    </aside>

    <div class="contenido" [class.mobile-map]="mobileTab() === 'map'" [class.mobile-list]="mobileTab() === 'list'">
      <!-- Pill bar: visible at 769–1100px instead of sidebar filtros -->
      <div class="pill-bar-wrap">
        <app-filtros mode="pill"
          [availableFuelTypes]="availableFuelTypes()"
          [availableBrands]="availableBrands()"
          [hasData]="hasSearched()"
          (filtersChanged)="onFiltersChanged($event)" />
      </div>

      @if (hasSearched() && filteredStations().length > 0) {
        <app-mapa
          [stations]="filteredStations()"
          [location]="userLocation()"
          [filters]="filters()"
          [routeTarget]="routeTarget()"
          [comparisonSelection]="comparisonSelection()"
          [highlightedStation]="highlightedStation()"
          [theme]="theme()"
          [active]="mobileTab() === 'map'"
          (toggleComparison)="onToggleComparison($event)"
          (stationHighlighted)="onMapStationHighlighted($event)"
          class="mapa-wrap">
        </app-mapa>
      }

      <app-resultados
        [stations]="filteredStations()"
        [filters]="filters()"
        [order]="order()"
        [loading]="loading()"
        [hasSearched]="hasSearched()"
        [comparisonSelection]="comparisonSelection()"
        [highlightedStationId]="highlightedStation()?.id ?? null"
        (orderChanged)="onOrderChanged($event)"
        (toggleComparison)="onToggleComparison($event)"
        (routeSelected)="onRouteSelected($event)"
        (stationSelected)="onStationSelected($event)">
      </app-resultados>
    </div>
  </main>

  <app-comparador
    [comparisonSelection]="comparisonSelection()"
    [filters]="filters()"
    (remove)="onRemoveFromComparison($event)"
    (clear)="onClearComparison()">
  </app-comparador>

  <nav class="mobile-tabs" role="tablist" aria-label="Navegación principal">
    <button class="mobile-tab" role="tab"
      [class.mobile-tab--active]="mobileTab() === 'search'"
      [attr.aria-selected]="mobileTab() === 'search'"
      (click)="setMobileTab('search')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Buscar
    </button>
    <button class="mobile-tab" role="tab"
      [class.mobile-tab--active]="mobileTab() === 'list'"
      [attr.aria-selected]="mobileTab() === 'list'"
      (click)="setMobileTab('list')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      Lista
    </button>
    <button class="mobile-tab" role="tab"
      [class.mobile-tab--active]="mobileTab() === 'map'"
      [attr.aria-selected]="mobileTab() === 'map'"
      (click)="setMobileTab('map')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
        <line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>
      </svg>
      Mapa
    </button>
  </nav>
</div>

<app-error-toast />
